# S3 sar U-Net. Laptop defaults (working subset); on the server override the data paths,
# e.g. --set data.root=/data/sn6/AOI_11_Rotterdam data.train_list=data/splits/train.txt
run_name: sar
modality: sar                     # optical (4 ch) | sar (4 ch) | fused (8 ch, optical first)
seed: 42
data:
  root: ~/geo-data/subset
  train_list: data/splits/subset_train.txt
  val_list: data/splits/subset_tune.txt   # tune split: model selection and threshold
  masks_dir: masks                 # under root (make masks)
  crop: 512                        # training crop, multiple of 32
  hflip: true                      # east-west only: keeps the SAR look direction
  align_orientation: true          # flip look-direction-1 strips north-south (decision D5)
  vary_by_epoch: true
  workers: 2
norm:
  optical: global                  # minmax (per tile) | global (train 2-98 % + z-score)
  sar: db_lee7                     # any arm in configs/preprocess.yaml sar.arms
model:
  pretrained: resnet34_imagenet    # key in configs/models.yaml pretrained, or null
optim:
  epochs: 30
  batch_size: 4                    # GTX 1650 4 GB with fp16
  lr: 0.0003
  weight_decay: 0.0001
  amp: auto                        # fp16 unless known unreliable (GTX 16xx) or a probe fails
  grad_clip: 1.0
loss:
  bce: 1.0
  dice: 1.0
eval:
  threshold: 0.5                   # tuned on the tune split later
  target: whole_tiles              # whole val tiles, padded to a multiple of 32
out_dir: outputs/runs
