# Dataset locations and split sources (SpaceNet 6, AOI 11 Rotterdam).
raw_root: /mnt/d/geo/raw/sn6            # read-only
sample_root: ~/geo-data/sample          # D1, extracted on WSL ext4
work_root: ~/geo-data                   # small working subset only
interim_root: /mnt/d/geo/interim/sn6/train/train/AOI_11_Rotterdam   # D2 extracted (SAR, PS-RGBNIR, labels)

aoi: AOI_11_Rotterdam
modalities:
  sar: SAR-Intensity                    # 4 pols (HH, HV, VH, VV), float32, already dB:
                                        # 10*log10 of 2x2-multilooked intensity;
                                        # 0 = nodata, 1e-5 = clipped floor (valid)
  optical: PS-RGBNIR                    # 4 bands, uint16
scenes:                                 # large scenes for S1 (stitching) and S4
  d3: /mnt/d/geo/interim/sn6/SN6_AOI_11_Rotterdam_PS-RGBNIR_TrainVal_cog.tif   # optical mosaic
  d4: /mnt/d/geo/processed/sn6/d4      # val-tile SAR + optical + labels mosaic (make d4)
  d3val: /mnt/d/geo/processed/sn6/d3val   # D3 cut to the official Val extent + All-Val labels
orientations: SummaryData/SAR_orientations.txt   # under interim_root: strip -> look direction 0/1
tile_id_regex: '_(\d{14}_\d{14}_tile_\d+)\.tif$'

splits:                                 # split by geography, never randomly
  # D2 tiles cover only x 590.1-596.7 km (western Train), so train | tune | val are
  # cut west to east over the covered x-range, inside the Train extent.
  train_extent: extents_masks/SN6_AOI_11_Rotterdam_Train-Extent.geojson
  tune_fraction: 0.15                   # middle strip: threshold tuning
  val_fraction: 0.20                    # eastern strip: tile-level held-out metrics
  # Official Val extent: no D2 tiles; used for scene-level optical eval on the D3 mosaic.
  val_scene_extent: extents_masks/SN6_AOI_11_Rotterdam_Val-Extent.geojson
  rule: inside                          # tile footprint must lie fully inside one region
  tolerance_m: 0.5                      # one pixel of slack at region edges
  out_dir: data/splits

subset:                                 # laptop working subset (COG copies on WSL ext4)
  root: ~/geo-data/subset
  counts: {train: 120, tune: 30, val: 50}
  min_free_gb: 5                        # refuse to fill the C: drive below this
  guard_paths: [/mnt/c]                 # WSL ext4 lives in a vhdx on C:; df on / is virtual

labels:
  val_buildings: geojson_buildings/SN6_AOI_11_Rotterdam_Buildings_All-Val.geojson
  # minimum building area lives in configs/postprocess.yaml (min_area_m2)
