# Offline service (plan section 3). Paths are inside the containers; GEOINFER_* environment
# variables override them (tests, local runs). The database URL comes only from
# GEOINFER_DB_URL (no credentials in the repo).
inbox: /data/inbox                  # scenes are registered from here (file drop, rule 4)
outputs: /data/outputs              # <job_id>/mask.tif and buildings.geojson
models_dir: /models                 # ONNX registry inside the image / volume (rule 3)
readiness_max_heartbeat_age_s: 10   # /readyz needs a worker heartbeat younger than this
tasks: [segment_buildings]
default_models:                     # models.id served per sensor mode (Phase 3 decision 2)
  optical: unet_r34_optical_clouds_v1
  sar: unet_r34_sar_lee7_v1
  fused: unet_r34_fused_clouds_v1
stats_file: stats/stats.json        # in models_dir: train-split normalisation statistics (S2)
preprocess_config: configs/preprocess.yaml   # SAR arm definitions (Lee window, domain, clip)
worker:
  poll_interval_s: 1.0              # sleep between empty queue polls
  heartbeat_interval_s: 3.0         # well under readiness_max_heartbeat_age_s
  batch_size: 8                     # tiles per ONNX Runtime call
  providers: [CUDAExecutionProvider, CPUExecutionProvider]   # first available wins
  max_aoi_mpx: 150                  # larger AOIs fail fast (the probability map is in RAM)
  scratch_dir: /data/scratch        # stitcher memmaps for AOIs above tiling memmap_min_px
  metrics_port: 9101                # Prometheus /metrics of the worker (0: off)
  scheduling:                       # E2 / E3 (src/geoinfer/service/worker/scheduler.py)
    batching: cross_job             # per_job | cross_job (dynamic batching across jobs)
    queue: priority                 # fifo | priority (priority + ageing * seconds waited)
    ageing_per_s: 0.1               # a priority-0 job overtakes a fresh priority-5 one after 50 s
    max_wait_ms: 25                 # hold a partial batch while a job is still reading tiles
    max_active_jobs: 2              # claimed jobs in flight (each holds a probability map)
    prefetch_tiles: 16              # normalised tiles read ahead per job
ui:                                 # web UI (served at /ui by the API)
  max_upload_gb: 20                 # largest GeoTIFF accepted by the upload
  prepare_gsd_m: 0.5                # 'Prepare' reprojects uploads to UTM at this pixel size
  tile_cache: 2048                  # map tiles kept in memory (256 px PNG each)
# Models the service ships (make service-models assembles them into one registry folder,
# with registry.yaml, stats/stats.json and one folder per model). Threshold and norm come
# from each run's eval.json and run.json; the export must have passed its parity check.
registry:
  unet_r34_optical_clouds_v1: {run: models/s3_clouds/s3_optical_clouds, sensor_mode: optical}
  unet_r34_sar_lee7_v1: {run: models/s3/sar, sensor_mode: sar}
  unet_r34_fused_clouds_v1: {run: models/s3_clouds/s3_fused_clouds, sensor_mode: fused}
# Demo scene for the stack smoke / air-gap test (scripts/make_demo_scene.py): a band of the
# D4 mosaic, chosen where one SAR look direction covers the most pixels.
demo_scene:
  source: d4                        # key under scenes: in configs/data.yaml
  rows: 4096                        # band height in px (full mosaic width, 2621 px)
  step: 512                         # candidate band offsets
