name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # PostGIS for the service database tests (marker `db`); throwaway CI-only credentials
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: geoinfer
          POSTGRES_PASSWORD: geoinfer-ci
          POSTGRES_DB: geoinfer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoinfer -d geoinfer_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GEOINFER_TEST_DB_URL: postgresql+psycopg://geoinfer:geoinfer-ci@localhost:5432/geoinfer_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # CPU-only: core DIP stack + service deps, no torch (keeps CI fast).
      - name: Install
        run: uv sync --frozen --extra serve

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -m "not gpu and not data" --cov=geoinfer --cov-report=term-missing
